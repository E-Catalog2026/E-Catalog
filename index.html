<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>E-Catalog</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=document_search" />
    <!-- SheetJS + PapaParse (CDN). ถ้าต้องการ offline ให้ดาวน์โหลดไฟล์ .js มาเก็บ local แล้วเปลี่ยน src -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="logo-section">
            <img src="KNAUF.png" alt="KNAUF Logo" class="knauf-logo">
            <!-- <span class="demo-version">demo version</span> -->
        </div>
        <div class="top-left-panel">
            <div id="gsStatus" class="gs-status" data-i18n="status_idle">Status: idle</div>
            <div id="langToggle">
                <button id="langToggleBtn" type="button">
                    <img class="lang-flag-img" src="https://flagcdn.com/w40/gb.png" alt="EN" width="24" height="18">
                    <span id="langToggleLabel">EN</span>
                </button>
            </div>
        </div>
        <h2><span class="material-symbols-outlined">document_search</span> <span id="appTitle" data-i18n="title">Information Search System</span></h2>


        <div class="search-grid" style="margin-bottom: 20px;">
            <div>
                <label>
                    <span class="material-icons">attach_file</span>
                    <span data-i18n="file_source">File Source</span>
                </label>
                <div class="input-icon">
                    <span id="fileName" style=" display: inline-block; color: #087f3a; font-weight: 500;"></span>
                </div>
            </div>
            <div>
                <label>
                    <span class="material-icons">store</span>
                    <span data-i18n="vendor_name">Vendor Name</span>
                </label>
                <div class="input-icon">
                    <input type="text" id="vendor">
                </div>
            </div>

            <div>
                <label>
                    <span class="material-icons">sell</span>
                    <span data-i18n="brand">Brand</span>
                </label>
                <div class="input-icon">
                    <input type="text" id="brand">
                </div>
            </div>

            <div>
                <label>
                    <span class="material-icons">numbers</span>
                    <span data-i18n="jde_stock_no">JDE Stock No</span>
                </label>
                <div class="input-icon">
                    <input type="text" id="jde">
                </div>
            </div>

            <div>
                <label>
                    <span class="material-icons">qr_code</span>
                    <span data-i18n="sap_stock_no">SAP Stock No</span>
                </label>
                <div class="input-icon">
                    <input type="text" id="sap">
                </div>
            </div>

            <div>
                <label>
                    <span class="material-icons">category</span>
                    <span data-i18n="spare_part_type">Spare Part Type</span>
                </label>
                <div class="input-icon">
                    <input type="text" id="spareType">
                </div>
            </div>
            <div>
                <label>
                    <span class="material-icons">article</span>
                    <span data-i18n="supplier_description">Supplier Description</span>
                </label>
                <div class="input-icon">
                    <input type="text" id="descriptionSearch">
                </div>
            </div>
            <button id="searchBtn"><span class="material-icons">search</span><span data-i18n="search">Search</span></button>
        </div>
        <div id="output"></div>
    </div>

    <div id="photoModal" class="photo-modal" aria-hidden="true">
        <div class="photo-card" role="dialog" aria-modal="true" aria-labelledby="photoModalTitle">
            <button id="photoModalClose" class="photo-modal-close" type="button" aria-label="Close preview">×</button>
            <div id="photoModalTitle" class="photo-card-title"></div>
            <img id="photoModalImage" class="photo-card-image" src="" alt="">
        </div>
    </div>

    <div id="overlay" data-i18n="processing">Processing...</div>

    <script>
        /* ------------ Column Aliases ------------- */
        const aliasLists = {
            "jde stock no": [
                "jde stock no", "jde stock no.", "jde", "jde no", "jde code", "jde item no", "jde item number",
                "jde sku", "jdestockno"],
            "sap stock no": [
                "sap stock no", "sap stock no.", "sap", "sap no", "material no", "material number", "sap item no"],
            "quotation no": [
                "quotation no", "quotation no.", "quotation number", "quote no", "quote number", "qt no", "qtn no"],
            "vendor name": ["vendor name", "vendor", "supplier name", "supplier"],
            "brand": ["brand", "manufacturer"],
            "supplier description": ["description", "item description", "supplier description"],
            "unit price": ["unit price", "price", "unit cost", "unit price (thb)", "unit price (thb) global contract", "unit price thb global contract"],
            "lead time": ["lead time", "delivery time"],
            "start date": ["start date", "effective date", "start"],
            "end date": ["end date", "expiry date", "expire date", "valid to"],
            "spare part type": ["spare part type", "spare part", "part type", "type", "spare type"],
            "supplier description th": ["supplier description th", "supplier description thai", "supplier description (th)", "description th", "description thai", "item description th"],
            "photos": ["photo", "photos", "image", "images", "photo url", "image url"]
        };

        /* ------------ Standard Columns ------------ */
        const standardColumns = [
            "Vendor Name", "JDE Stock No", "SAP Stock No", "Brand",
            "Supplier Description", "Photos", "Unit Price", "Lead Time",
            "Start Date", "End Date", "Quotation No", "Credit Term"
        ];

        /* ------------ Translations (EN / TH) ------------ */
        const translations = {
            en: {
                title: "Information Search System",
                file_source: "File Source",
                vendor_name: "Vendor Name",
                brand: "Brand",
                jde_stock_no: "JDE Stock No",
                sap_stock_no: "SAP Stock No",
                spare_part_type: "Spare Part Type",
                supplier_description: "Supplier Description",
                unit_price: "Unit Price",
                lead_time: "Lead Time",
                start_date: "Start Date",
                end_date: "End Date",
                quotation_no: "Quotation No",
                credit_term: "Credit Term",
                photos: "Photos",
                photo_preview: "Photo Preview",
                no_image: "No Image",
                search: "Search",
                processing: "Processing...",
                status_idle: "Status: connected",
                no_data_upload: "No data found ( Please upload a file )",
                enter_keywords: "( Please enter search keywords )",
                no_data_found: "( No data found )",
                result: "Result"
            },
            th: {
                title: "ระบบค้นหาข้อมูล",
                file_source: "ฐานข้อมูล",
                vendor_name: "ผู้จำหน่าย",
                brand: "แบรนด์/ยี่ห้อ",
                jde_stock_no: "เลข JDE",
                sap_stock_no: "เลข SAP",
                spare_part_type: "ประเภทอะไหล่",
                supplier_description: "คำอธิบายสินค้า",
                unit_price: "ราคาต่อหน่วย",
                lead_time: "ระยะเวลาจัดส่ง",
                start_date: "วันที่เริ่มต้น",
                end_date: "วันที่สิ้นสุด",
                quotation_no: "หมายเลขใบเสนอราคา",
                credit_term: "เงื่อนไขการชำระเงิน",
                photos: "รูปภาพ",
                photo_preview: "รูปภาพตัวอย่าง",
                no_image: "ไม่มีรูปภาพ",
                search: "ค้นหา",
                processing: "กำลังประมวลผล...",
                status_idle: "สถานะ: เชื่อมต่อแล้ว",
                no_data_upload: "ไม่พบข้อมูล ( กรุณาอัปโหลดไฟล์ )",
                enter_keywords: "( กรุณากรอกคำค้น )",
                no_data_found: "( ไม่พบข้อมูล )",
                photo_preview: "รูปภาพตัวอย่าง",
                result: "ผลลัพธ์"
            }
        };

        const descriptionTranslationMap = {
            // ถ้าต้องการแปลคำอธิบายสินค้าด้วยตัวเอง ให้เพิ่มคู่คำแปลที่นี่
            "pump": "ปั๊ม",
            "cement": "ปูน",
            "steel pipe": "ท่อเหล็ก",
            "insulation board": "แผ่นฉนวน"
        };

        function translateSupplierDescription(value){
            if (!value) return value;
            const key = value.toString().trim().toLowerCase();
            return descriptionTranslationMap[key] || value;
        }

        const headerTranslationKeys = {
            "Vendor Name": "vendor_name",
            "JDE Stock No": "jde_stock_no",
            "SAP Stock No": "sap_stock_no",
            "Brand": "brand",
            "Supplier Description": "supplier_description",
            "Photos": "photos",
            "Unit Price": "unit_price",
            "Lead Time": "lead_time",
            "Start Date": "start_date",
            "End Date": "end_date",
            "Quotation No": "quotation_no",
            "Credit Term": "credit_term"
        };

        function headerLabel(key) {
            return t(headerTranslationKeys[key] || key);
        }

        let currentLang = localStorage.getItem('lang') || 'en';

        function t(key){
            return (translations[currentLang] && translations[currentLang][key]) || (translations.en[key] || key);
        }

        function applyTranslations(){
            document.getElementById('appTitle').textContent = t('title');
            document.querySelectorAll('[data-i18n]').forEach(el=>{
                const key = el.getAttribute('data-i18n');
                if(key && translations[currentLang] && translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });
            // placeholders
            const v = document.getElementById('vendor'); if(v) v.placeholder = t('vendor_name');
            const j = document.getElementById('jde'); if(j) j.placeholder = t('jde_stock_no');
            const s = document.getElementById('sap'); if(s) s.placeholder = t('sap_stock_no');
            const b = document.getElementById('brand'); if(b) b.placeholder = t('brand');
            const sp = document.getElementById('spareType'); if(sp) sp.placeholder = t('spare_part_type');
            // status
            const gs = document.getElementById('gsStatus'); if(gs) gs.textContent = t('status_idle');
            // overlay
            const ov = document.getElementById('overlay'); if(ov) ov.textContent = t('processing');
        }

        function setLang(lang){
            currentLang = lang;
            localStorage.setItem('lang', lang);
            applyTranslations();
            const btn = document.getElementById('langToggleBtn');
            if(btn){
                const flag = btn.querySelector('.lang-flag-img');
                const label = document.getElementById('langToggleLabel');
                const nextLang = currentLang === 'en' ? 'th' : 'en';
                if(flag){
                    flag.src = currentLang === 'en' ? 'https://flagcdn.com/w40/gb.png' : 'https://flagcdn.com/w40/th.png';
                    flag.alt = currentLang === 'en' ? 'EN' : 'ไทย';
                }
                if(label){
                    label.textContent = currentLang === 'en' ? 'EN' : 'ไทย';
                }
                btn.classList.add('active');
                btn.setAttribute('data-next-lang', nextLang);
                btn.setAttribute('aria-label', currentLang === 'en' ? 'Switch to Thai' : 'Switch to English');
            }
        }

        /* Helpers */
        function norm(s) { return String(s || "").toLowerCase().replace(/[\n\r.\-_,()]/g, "").trim(); }

        function matchHeader(h) {
            const key = norm(h);
            for (const std in aliasLists) {
                for (const a of aliasLists[std]) {
                    if (key === norm(a)) return std;
                }
            }
            return null;
        }

        function escapeHTML(s) {
            return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
        }

        /* Format date */
        function ddmmyyyy(v) {
            if (!v) return "";

            // 1) Excel serial number
            if (typeof v === "number") {
                const d = XLSX.SSF.parse_date_code(v);
                if (d && d.y) {
                    return `${String(d.d).padStart(2, '0')}-${String(d.m).padStart(2, '0')}-${d.y}`;
                }
            }

            if (typeof v === "string") {
                v = v.trim();

                // 2) DD/MM/YYYY or DD-MM-YYYY
                let m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
                if (m) {
                    return `${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}-${m[3]}`;
                }

                // 3) MM/DD/YY  (เช่น 1/15/24)
                m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2})$/);
                if (m) {
                    const year = Number(m[3]) + 2000; // 24 → 2024
                    return `${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}-${year}`;
                }

                // 4) YYYY-MM-DD
                m = v.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
                if (m) {
                    return `${String(m[3]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}-${m[1]}`;
                }
            }

            return v; // fallback ถ้าอ่านไม่ออก
        }

        function showOverlay(x) {
            document.getElementById("overlay").style.display = x ? "block" : "none";
        }

        /* ------------ Global Dataset (all sheets combined) ------------ */
        let allData = [];

        /* ------------ Google Sheets loader (public CSV export) ------------ */
        // If you want automatic loading, set AUTO_GSHEET_URL to a public sheet URL.
        const AUTO_GSHEET_URL = "https://docs.google.com/spreadsheets/d/1KQddH8khGnU-nFVeTT3urNueEJ1_R4yL/edit?usp=sharing&ouid=114342933923439825885&rtpof=true&sd=true";

        function parseGSheetUrl(url){
            try{
                const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if(!idMatch) return null;
                const id = idMatch[1];
                const gidMatch = url.match(/[?&]gid=(\d+)/);
                const gid = gidMatch ? gidMatch[1] : null;
                return {id,gid};
            }catch(e){return null;}
        }

        function loadGoogleSheetFromUrl(url){
            const info = parseGSheetUrl(url);
            if(!info){ setGStatus('error','Invalid Google Sheet URL'); return; }

            const exportUrl = `https://docs.google.com/spreadsheets/d/${info.id}/export?format=csv${info.gid?('&gid='+info.gid):''}`;
            setGStatus('loading','Loading...');
            showOverlay(true);
            fetch(exportUrl).then(r=>{
                if(!r.ok) throw new Error('Failed to fetch sheet. It may not be public.');
                return r.text();
            }).then(text=>{
                Papa.parse(text,{header:true,skipEmptyLines:true,complete:(res)=>{ 
                    allData = []; 
                    processSheet('GoogleSheet', res.data); 
                    setGStatus('ok','Loaded'); showOverlay(false); 
                    document.getElementById('fileName').textContent = "E-Catalog 2026.xlsx (Google Sheet)";
                }, error:(err)=>{ setGStatus('error',err.message); alert(err.message); showOverlay(false); }});
            }).catch(err=>{ setGStatus('error',err.message); alert('Error loading Google Sheet: '+err.message); showOverlay(false); });
        }
        
        // Status helper for the top-right indicator
        function setGStatus(state, msg){
            const el = document.getElementById('gsStatus');
            if(!el) return;
            el.classList.remove('ok','error','loading');
            if(state) el.classList.add(state);
            el.textContent = msg ? msg : (state||'idle');
        }

        // Auto-load if AUTO_GSHEET_URL is set
        window.addEventListener('load', ()=>{
            if(AUTO_GSHEET_URL){
                try{
                    loadGoogleSheetFromUrl(AUTO_GSHEET_URL);
                }catch(e){ console.warn('Auto load failed', e); setGStatus('error','Auto-load failed'); }
            }
            const toggleBtn = document.getElementById('langToggleBtn');
            if(toggleBtn){
                toggleBtn.addEventListener('click', ()=>{
                    const nextLang = toggleBtn.getAttribute('data-next-lang') || (currentLang === 'en' ? 'th' : 'en');
                    setLang(nextLang);
                });
            }
            setLang(currentLang);
        });

        /* Process a sheet */
        function processSheet(name, rows) {
            if (rows.length === 0) return;

            const headers = Object.keys(rows[0]);
            const headerMap = {};

            headers.forEach(h => {
                const std = matchHeader(h);
                if (std) headerMap[std] = h;
                else headerMap[norm(h)] = h;
            });

            console.log("Sheet:", name, "Headers:", headers);

            rows.forEach(row => {
                const obj = {};
                const spareCol = headerMap["spare part type"];
                const translatedDescCol = headerMap["supplier description th"];
                obj["Spare Part Type"] = spareCol ? row[spareCol] : "";
                standardColumns.forEach(std => {
                    let col = headerMap[std] || headerMap[norm(std)];
                    let val = col ? row[col] : "";
                    if (std === "Start Date" || std === "End Date") val = ddmmyyyy(val);
                    obj[std] = val ?? "";
                });
                obj["Supplier Description TH"] = translatedDescCol ? row[translatedDescCol] : "";
                allData.push(obj);
            });
        }

        /* Search Function */
        document.getElementById("searchBtn").addEventListener("click", search);

        function openPhotoModal(url) {
            const modal = document.getElementById('photoModal');
            const img = document.getElementById('photoModalImage');
            const title = document.getElementById('photoModalTitle');
            if (!url) return;
            img.src = url;
            img.alt = t('photo_preview');
            title.textContent = t('photo_preview');
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function closePhotoModal() {
            const modal = document.getElementById('photoModal');
            const img = document.getElementById('photoModalImage');
            if (!modal) return;
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
            if (img) img.src = '';
        }

        document.addEventListener('click', event => {
            const button = event.target.closest('.photo-icon-btn');
            if (button) {
                openPhotoModal(button.dataset.url);
            }
            if (event.target.matches('#photoModal') || event.target.matches('#photoModalClose')) {
                closePhotoModal();
            }
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closePhotoModal();
            }
        });

        ["vendor", "jde", "sap", "brand", "spareType", "descriptionSearch"].forEach(id => {
            document.getElementById(id).addEventListener("keydown", e => {
                if (e.key === "Enter") search();
            });
        });

        function search() {
            if (allData.length === 0) {
                renderNoData("No data found ( Please upload a file )");
                return;
            }

            const vendor = document.getElementById("vendor").value.toLowerCase().trim();
            const jde = document.getElementById("jde").value.toLowerCase().trim();
            const sap = document.getElementById("sap").value.toLowerCase().trim();
            const brand = document.getElementById("brand").value.toLowerCase().trim();
            const spareType = document.getElementById("spareType").value.toLowerCase().trim();
            const descriptionSearch = document.getElementById("descriptionSearch").value.toLowerCase().trim();

            // ⛔ ถ้าไม่กรอกอะไรเลย → แสดง No data found ในตาราง
            if (!vendor && !jde && !sap && !brand && !spareType && !descriptionSearch) {
                renderNoData("( Please enter search keywords )");
                return;
            }

            const filtered = allData.filter(r => {
                const descEn = (r["Supplier Description"] || "").toString().toLowerCase();
                const descTh = (r["Supplier Description TH"] || translateSupplierDescription(r["Supplier Description"]) || "").toString().toLowerCase();
                return (
                    (!vendor || (r["Vendor Name"] && r["Vendor Name"].toLowerCase().includes(vendor))) &&
                    (!jde || (r["JDE Stock No"] && r["JDE Stock No"].toLowerCase().includes(jde))) &&
                    (!sap || (r["SAP Stock No"] && r["SAP Stock No"].toLowerCase().includes(sap))) &&
                    (!brand || (r["Brand"] && r["Brand"].toLowerCase().includes(brand))) &&
                    (!spareType || (r["Spare Part Type"] && r["Spare Part Type"].toLowerCase().includes(spareType))) &&
                    (!descriptionSearch || descEn.includes(descriptionSearch) || descTh.includes(descriptionSearch))
                );
            });

            renderTable(filtered);
        }

        function renderNoData(msg) {
            const out = document.getElementById("output");
            out.innerHTML = `
        <table><thead><tr><th>${escapeHTML(t('result'))}</th></tr></thead>
        <tbody><tr><td class="no-data">${escapeHTML(msg)}</td></tr></tbody></table>
    `;
        }

        function formatAccounting(val) {
            if (val === null || val === undefined || val === "") return "";

            // แปลง string → number
            let num = Number(String(val).replace(/,/g, ""));
            if (isNaN(num)) return val;

            // รูปแบบ accounting
            if (num < 0) {
                return `(${Math.abs(num).toLocaleString(undefined, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                })})`;
            }

            return num.toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        /* Render */
        function renderTable(rows) {
            const out = document.getElementById("output");
            if (rows.length === 0) {
                out.innerHTML = `
        <div class="table-wrapper">
            <table>
                <thead><tr><th>${escapeHTML(t('result'))}</th></tr></thead>
                <tbody><tr><td class="no-data">${escapeHTML(t('no_data_found'))}</td></tr></tbody>
            </table>
        </div>`;
                return;
            }

            let html = `<div class="table-wrapper"><table><thead><tr>`;
            standardColumns.forEach(c => html += `<th>${escapeHTML(headerLabel(c))}</th>`);
            html += "</tr></thead><tbody>";

            rows.forEach(r => {
                html += "<tr>";
                standardColumns.forEach(c => {
                    if (c === "Photos") {
                        const photoUrl = String(r[c] || "").trim();
                        if (photoUrl) {
                            html += `<td class="photo-cell"><button type="button" class="photo-icon-btn" data-url="${escapeHTML(photoUrl)}" title="${escapeHTML(t('photo_preview'))}"><span class="material-icons">image</span></button></td>`;
                        } else {
                            html += `<td class="no-image">${escapeHTML(t('no_image'))}</td>`;
                        }
                    } else if (c === "Supplier Description") {
                        const desc = currentLang === 'th' ? (r["Supplier Description TH"] || translateSupplierDescription(r[c])) : r[c];
                        html += `<td class="td-desc">${escapeHTML(desc)}</td>`;
                    } else if (c === "Unit Price") {
                        html += `<td class="td-price">${formatAccounting(r[c])}</td>`;
                    } else {
                        html += `<td>${escapeHTML(r[c])}</td>`;
                    }
                });
                html += "</tr>";
            });

            html += "</tbody></table></div>";
            out.innerHTML = html;
        }

    </script>

</body>

</html>
